apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: secure-web-restrictive
  namespace: rlogics-secure-demo
spec:
  podSelector:
    matchLabels:
      app: secure-web
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              access-secure-web: "true"
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53